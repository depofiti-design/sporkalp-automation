name: Spor'un Kalbi - Ana Otomasyon

on:
  schedule:
    # 08:00-22:59 (İstanbul, UTC+3) = 05:00-19:59 UTC, 20 dk'da bir tetiklenir.
    # Her tetiklemede otomasyon günlük 15-20 hedefine göre rastgele olasılıkla
    # post atar ya da atlar — sabit saat başı deseni oluşmaz.
    - cron: "*/20 5-19 * * *"
  workflow_dispatch: {}

concurrency:
  group: sporkalp-auto-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları kur
        run: pip install -r requirements-ci.txt

      - name: .env oluştur
        run: |
          cat > .env <<EOF
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID=${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_CHANNEL_USERNAME=${{ secrets.TELEGRAM_CHANNEL_USERNAME }}
          INSTAGRAM_USERNAME=${{ secrets.INSTAGRAM_USERNAME }}
          INSTAGRAM_PASSWORD=${{ secrets.INSTAGRAM_PASSWORD }}
          INSTAGRAM_SESSIONID=${{ secrets.INSTAGRAM_SESSIONID }}
          EOF

      - name: Post at (rastgele tempo)
        run: python auto_post.py

      - name: Durum dosyalarını kaydet
        run: |
          git config user.name "sporkalp-bot"
          git config user.email "actions@users.noreply.github.com"
          git add out/_seen_links.txt out/_post_log.csv out/_daily_target.txt out/ig_session.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: post log güncelle [skip ci]"
          git pull --rebase --autostash
          git push
